name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (typecheck / lint / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm install (not `npm ci`): depo Windows'ta bakiliyor; @tailwindcss/oxide-wasm32-wasi'nin
      # BUNDLE'lanmis @emnapi/core+runtime optional dep'leri yalniz Linux'ta cozulur, Windows npm
      # bunlari lockfile'a yazamaz -> `npm ci` EUSAGE verir. `npm install` lockfile'i kullanir,
      # drift'i tolere eder, EUSAGE atmaz. (Dogru lockfile ancak Linux'ta uretilebilir.)
      - run: npm install --no-audit --no-fund
      - run: npm run audit:seo
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Deploy indikten sonra CF cache'ini isit: QD, CI yesili sonrasi (2-5dk "oynak" gecikme)
  # deploy eder. Bu job canli index.html commit'li hash'e gelene kadar bekler, sonra yeni
  # asset'leri fetch'leyip CF'e 200 yazdirir -> gecici-404'un immutable cache'lenme yarisini
  # kazanir ("TavlaTv yuklenemedi" tuzagi). Yalniz main push'ta; build yesilse (QD da oyle).
  warm-cf:
    name: Warm Cloudflare cache (post-deploy)
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Isitma best-effort onleme: hata verse de CI'yi KIRMIZI yapma (yoksa "CI kirmizi ->
    # Forge deploy etmez" yanlis-okumasini tetikler; deploy zaten bu job'dan ONCE inmistir).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Secret'lar varsa oto-purge devreye girer (stale-404 tedavisi); yoksa sadece isitma
      # (onleme). GitHub: Settings -> Secrets and variables -> Actions -> CF_API_TOKEN (Cache
      # Purge izinli token) + CF_ZONE_ID.
      - run: npm run deploy:warm
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

  backend:
    name: Backend (Laravel / PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl
          coverage: none
      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php artisan key:generate
      - name: Run tests
        run: php artisan test
