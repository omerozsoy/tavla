workflows:
  tavlatv-ios:
    name: TavlaTV iOS
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        # Android applicationId + Capacitor appId ile aynı (com.tavlatv.app).
        bundle_identifier: com.tavlatv.app
      # App Store Connect API anahtarı (.p8) — Codemagic panel > Environment variables'ta
      # "appstore_credentials" grubuna ekle, üçünü de SECURE işaretle:
      #   APP_STORE_CONNECT_PRIVATE_KEY   = .p8 dosyasının İÇERİĞİ (çok satırlı)
      #   APP_STORE_CONNECT_KEY_IDENTIFIER = Key ID
      #   APP_STORE_CONNECT_ISSUER_ID      = Issuer ID
      # (Takım entegrasyonu "auth: integration" bireysel planda yok -> API anahtarı yolu.)
      groups:
        - appstore_credentials
      vars:
        XCODE_SCHEME: App

    scripts:
      - name: Npm bağımlılıklarını yükle
        # npm install (npm ci DEĞİL): lock Windows'ta üretiliyor, mac builder'da
        # @emnapi/* gibi optional native-wasm dep'leri lock'ta eksik kalıyor ->
        # npm ci "out of sync" diye patlar. npm install platforma göre çözer.
        script: npm install

      - name: Web dosyalarını derle
        script: npm run build --if-present

      - name: Capacitor iOS platformunu ekle (yoksa)
        script: |
          set -e
          [ -d ios ] || npx cap add ios

      - name: Capacitor iOS projesini eşitle
        script: npx cap sync ios

      - name: iOS uygulama ikonunu üret (assets/icon.png -> AppIcon)
        # Proje CI'da sifirdan uretiliyor (npx cap add ios) -> iOS AppIcon Capacitor VARSAYILAN (mavi
        # placeholder) kalir -> App Store 2.3.8 (generic icon) REDDEDER. @capacitor/assets ile assets/
        # kaynak ikonlardan (icon.png 1024x1024) gercek TavlaTV ikonunu uret. Android bunu lokal yapip
        # commit'lemis; iOS proje CI'da dogdugu icin burada uretmek sart. iOS AppIcon alpha'siz olur.
        script: npx capacitor-assets generate --ios

      - name: Şifreleme muafiyetini işaretle (ITSAppUsesNonExemptEncryption)
        # App Store Connect her build'de "ihracat uyumluluğu / şifreleme" sorusunu
        # sormasın diye Info.plist'e kalıcı olarak ekle. Proje CI'da üretildiği için
        # (npx cap add ios) repoda Info.plist yok -> sync sonrası enjekte ediyoruz.
        script: |
          set -e
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"

      - name: Kamera/Galeri izin açıklamaları (Fotoğraftan Analiz) enjekte et
        # /foto-analiz WebView <input capture> ile kameradan foto ceker / galeriden secer.
        # iOS WKWebView bu izin DIALOG metinlerini (NSCameraUsageDescription / NSPhotoLibraryUsageDescription)
        # ARAR; YOKSA kamera/galeri erisimi reddedilir + App Store reddi. cap add ios Info.plist'i sifirdan
        # urettigi icin encryption flag'i gibi enjekte ediyoruz (Set-varsa / Add-yoksa, idempotent).
        script: |
          set -e
          PLIST=ios/App/App/Info.plist
          CAM="Tavla tahtanızın fotoğrafını çekip pozisyonu analiz etmek için kamera erişimi gerekir."
          LIB="Galeriden tavla tahtası fotoğrafı seçip pozisyonu analiz etmek için fotoğraf erişimi gerekir."
          /usr/libexec/PlistBuddy -c "Set :NSCameraUsageDescription $CAM" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string $CAM" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSPhotoLibraryUsageDescription $LIB" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string $LIB" "$PLIST"

      - name: Google Sign-In URL scheme (reversed iOS client ID) enjekte et
        # GoogleSignIn-iOS, signIn(withPresenting:) cagrisinda Info.plist'te bu CUSTOM URL SCHEME'i ARAR;
        # YOKSA yakalanmamis exception firlatir -> uygulama butona basar basmaz COKER. Scheme = iOS OAuth
        # client ID'nin ters hali (com.googleusercontent.apps.<client-id-govdesi>). Proje CI'da sifirdan
        # uretildigi (npx cap add ios) icin Info.plist repoda yok -> encryption flag'i gibi enjekte ediyoruz.
        # plistlib: dogru parse/yaz, index hesaplama yok, idempotent, mevcut Capacitor scheme'ine dokunmaz.
        script: |
          set -e
          PLIST=ios/App/App/Info.plist
          SCHEME=com.googleusercontent.apps.164766354103-h8g304p9for1hvid2prbkbe07hvvfvif
          python3 - "$PLIST" "$SCHEME" <<'PY'
          import sys, plistlib
          path, scheme = sys.argv[1], sys.argv[2]
          with open(path, 'rb') as f:
              p = plistlib.load(f)
          types = p.setdefault('CFBundleURLTypes', [])
          if not any(scheme in d.get('CFBundleURLSchemes', []) for d in types):
              types.append({'CFBundleURLSchemes': [scheme]})
          with open(path, 'wb') as f:
              plistlib.dump(p, f)
          print('CFBundleURLTypes ->', p['CFBundleURLTypes'])
          PY

      - name: Build numarasini benzersiz yap (CFBundleVersion)
        # cap add ios Info.plist'i her build'de SIFIRDAN uretir -> CFBundleVersion hep "1" kalir ->
        # App Store Connect ikinci yuklemede "bundle version must be higher than 1" (409) ile REDDEDER.
        # Epoch saniye = her build'de artan, onceki yuklemeden kesin buyuk, APPLE_ID/ag CLI gerekmez.
        # (Kullaniciya gorunen surum CFBundleShortVersionString=1.0 degismez; bu yalniz ic build no.)
        script: |
          set -e
          PLIST=ios/App/App/Info.plist
          BUILD_NO=$(date +%s)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NO" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NO" "$PLIST"

      - name: Apple ile Giriş entitlement'i ekle ve projeye bağla
        # Apple Sign-In icin App.entitlements'ta com.apple.developer.applesignin GEREKIR + App target
        # CODE_SIGN_ENTITLEMENTS bu dosyaya isaret etmeli; yoksa imzalama provisioning ile eslesmez
        # (Apple Developer'da App ID'ye "Sign in with Apple" capability EKLENMIS olmali). Proje CI'da
        # sifirdan uretildigi icin (npx cap add ios) entitlements yok -> olustur + xcodeproj ile bagla.
        # xcode-project use-profiles'dan ONCE calismali (imzalama entitlements'i okur).
        script: |
          set -e
          cat > ios/App/App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.developer.applesignin</key>
            <array><string>Default</string></array>
          </dict>
          </plist>
          PLIST
          gem list -i xcodeproj >/dev/null 2>&1 || gem install xcodeproj --no-document
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target = project.targets.find { |t| t.name == 'App' }
          target.build_configurations.each do |c|
            c.build_settings['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements'
          end
          project.save
          puts "CODE_SIGN_ENTITLEMENTS baglandi: App/App.entitlements"
          RUBY

      - name: iOS imzalama profillerini uygula
        script: |
          set -e
          cd ios/App
          xcode-project use-profiles

      - name: İmzalı IPA oluştur
        script: |
          set -e
          cd ios/App
          if [ -d App.xcworkspace ]; then
            xcode-project build-ipa --workspace App.xcworkspace --scheme "$XCODE_SCHEME"
          else
            xcode-project build-ipa --project App.xcodeproj --scheme "$XCODE_SCHEME"
          fi

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        # Entegrasyon DEĞİL, API anahtarı (environment variable) ile kimlik doğrulama.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Önce yalnız TestFlight'a yükle (App Store incelemesine otomatik SOKMAZ).
        # App Store'a otomatik göndermek istediğinde submit_to_app_store: true ekle.
        submit_to_testflight: true
